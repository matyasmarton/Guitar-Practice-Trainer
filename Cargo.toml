[workspace]
resolver = "2"
members = ["crates/core", "crates/tui", "tools/bindgen-cli", "tools/audio-diag"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
repository = "https://example.invalid/guitar-practice-trainer"

[workspace.dependencies]
guitar_trainer_core = { path = "crates/core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Profile shared by libs/binaries.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1